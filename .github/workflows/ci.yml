name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: interpreter
        run: python --version
      - name: spec integrity (hash-pinned upstream vectors, unmodified)
        run: cd spec && sha256sum -c ../SPEC_SHA256SUMS
      - name: unit tests
        run: python -m unittest -v test_verify_tersign
      - name: unit tests — crypto profile runner (PR #11)
        run: python -m unittest -v test_crypto_profile
      - name: EIP-712 reveal — commitment recomputes (exit 0 = MATCH, exit 1 = NO MATCH)
        run: cd eip712 && python verify_commitment.py
      - name: EIP-712 — corrected runner on the 52 committed vectors with ERRATA_EXPECT.json (exit 0 = 52/52 and every built-in mutant killed)
        run: cd eip712 && python runner/verify_eip712.py commitment-3b766320/out --errata ERRATA_EXPECT.json --mutants
      - name: EIP-712 — runner unit tests
        run: cd eip712/runner && python -m unittest -v test_verify_eip712
      - name: evidence-pinning rev 9 — corpus pinned by sha256, raw checker output equals the frozen one, 47/47 and 44/47
        run: |
          cd evidence-pinning-rev9
          curl -sSfL -o "$RUNNER_TEMP/rev9.json" https://raw.githubusercontent.com/TKCollective/tanilo-receipt-spec/0dffb77fa117099438d5ec15fbb48b2311792d26/fixtures/evidence-pinning-fixtures-v2-rev9.json
          echo "3c5f4bf42d5e60c4e424d9a301f1efbfdffba642f2f7b80b2cec1727e0873724  $RUNNER_TEMP/rev9.json" | sha256sum -c -
          python harness.py "$RUNNER_TEMP/rev9.json" "$RUNNER_TEMP/raw.json"
          echo "02726d0307825ba281a1f370cd5383318fd3bf992d38aaaf5c907d3313e0e772  $RUNNER_TEMP/raw.json" | sha256sum -c -
          python confronto.py "$RUNNER_TEMP/rev9.json" "$RUNNER_TEMP/raw.json" "$RUNNER_TEMP/cmp.json"
          python -c "import json,sys; s=json.load(open(sys.argv[1]))['summary']; c=(s['vectors'],s['verdict_agree'],s['harness_rule_agree'],s['strict_agree']); print(c); sys.exit(0 if c==(47,47,47,44) else 1)" "$RUNNER_TEMP/cmp.json"
          python selftest_filed.py
          python controlli.py "$RUNNER_TEMP/rev9.json" "$RUNNER_TEMP/ctl.json"
          python -c "import json,sys; d=json.load(open(sys.argv[1])); ok=[x['pass'] for k,v in d.items() if k.startswith('P') for x in (v if isinstance(v,list) else [v])]; print(len(ok),'controls', ok); sys.exit(0 if ok and all(ok) else 1)" "$RUNNER_TEMP/ctl.json"
      - name: evidence-pinning rev 10 proposed vectors — byte-identical rebuild, 8/8 on our checker and on babyblueviper1's at bcf6592; positive control, at 5c72428 exactly vectors 7 and 8 fail
        run: |
          python evidence-pinning-rev10-proposed/build.py --check
          git clone -q https://github.com/babyblueviper1/preaction-governance-conformance.git "$RUNNER_TEMP/bbv"
          # bcf6592 anchors babyblueviper1's form checks with \Z (babyblueviper1/preaction-governance-conformance#12):
          # before it, ^...$ with re.match accepted one trailing "\n" on snippet_sha256 and retrieved_at, the two cases
          # vectors 7 and 8 encode; 5c72428 is the commit before the fix
          git -C "$RUNNER_TEMP/bbv" checkout -q bcf6592
          python evidence-pinning-rev10-proposed/run_vectors.py --ours evidence-pinning-rev9/es_check_filed.py --bbv "$RUNNER_TEMP/bbv/tools/evidence_set_check.py"
          git -C "$RUNNER_TEMP/bbv" checkout -q 5c72428
          set +e
          python evidence-pinning-rev10-proposed/run_vectors.py --bbv "$RUNNER_TEMP/bbv/tools/evidence_set_check.py" --json > "$RUNNER_TEMP/pc.json"; rc=$?
          set -e
          # the two must fail for the pre-fix reason (the form check lets the value through and the run goes on), not for a
          # root mismatch: vector 7 ends unknown, vector 8 resolved
          python -c "import json,sys; d=json.load(open(sys.argv[1])); f=sorted((r['id'], r['bbv']['outcome']) for r in d['rows'] if not r['bbv_pass']); print('rc', sys.argv[2], 'failing', f); sys.exit(0 if sys.argv[2] == '1' and f == [('evi-retrieved-at-trailing-newline-rejects', 'resolved'), ('evi-snippet-sha256-trailing-newline-rejects', 'unknown')] else 1)" "$RUNNER_TEMP/pc.json" "$rc"
      - name: suite (69 vectors, expect 69/69 verdict and 40/40 reason)
        run: python verify_tersign.py spec/
      - name: held-out separators (5 vectors)
        run: python verify_tersign.py heldout/
      - name: positive control — flipped expect must be 0/69 (exit 1)
        run: |
          set +e
          out=$(python verify_tersign.py spec/ --flip-expect --quiet); rc=$?
          echo "$out"
          if [ "$rc" -eq 0 ] || [ "$out" != "fully concordant 0/69" ]; then echo "flip-expect did NOT fail as required"; exit 1; fi
      - name: positive control — mutated valid vectors must all reject
        run: python verify_tersign.py spec/ --mutate --quiet
      - name: positive controls on live-ledger values (independent of `expect`)
        run: python positive_controls.py spec/
      - name: ablations (one rule off at a time)
        run: python ablation_study.py spec/
      - name: vector audit — ablation/twin measurement, live-data and OTS proof checks (offline, from captured bytes)
        run: |
          python docs/vector-audit/audit_driver.py
          python docs/vector-audit/live_check.py
          python docs/vector-audit/ots_check.py
      - name: out-of-suite variants regenerate deterministically (524, sha256 of mutated manifest pinned)
        run: |
          python docs/differential/generate_variants.py spec/ /tmp/variants
          echo "b738f040a7ecf3dd199011c33611c7b81aa2c56c96054e39f552e0681dff51ea  /tmp/variants/MANIFEST.json" | sha256sum -c -

  gitleaks:
    name: gitleaks (pinned release, default rules)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: download gitleaks release and verify its published checksum
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o gitleaks.tar.gz "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" checksums.txt | sed 's# .*#  gitleaks.tar.gz#' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: scan the git history (default rules)
        run: ./gitleaks git --redact --verbose --exit-code 1 .
      - name: scan the working tree (default rules)
        run: ./gitleaks dir --redact --verbose --exit-code 1 .
